<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>声桥 · 对话与录音</title><link rel="stylesheet" href="/demo/assets/style.css"><script type="module" src="/demo/assets/client.js"></script></head>
<body><div class="app-shell">
<aside class="sidebar"><a class="brand" href="#chat"><span class="brand-mark" aria-hidden="true">声</span>声桥 <small>VoiceHub</small></a><p class="nav-label">我的空间</p><nav aria-label="主菜单"><a href="#chat" data-page="chat" aria-current="page"><span aria-hidden="true">◌</span> 对话</a><a href="#recordings" data-page="recordings"><span aria-hidden="true">≋</span> 会议录音</a></nav><div class="sidebar-note">聊一聊，或认真记录。<br>每件事都有自己的位置。</div><p id="status" role="status" aria-live="polite">尚未连接</p><a id="connection-toggle" class="settings-link" href="#connection">连接设置</a></aside>
<main><header class="topbar"><div><p class="eyebrow" id="page-kicker">和声桥一起</p><h1 id="page-title">对话</h1></div><span class="connection-dot" id="connection-badge">未连接</span></header>
<section class="connection-panel" id="connection-panel" hidden aria-labelledby="connection-title"><div><h2 id="connection-title">先连接，再开始</h2><p class="hint">从管理页面复制连接码，粘贴到这里。连接码只保留在当前页面。</p></div><form id="connection"><label>服务地址<input id="server" type="url" required></label><label>连接码<input id="token" type="password" autocomplete="off" required placeholder="粘贴管理员提供的连接码"></label><button>连接</button><button id="disconnect" class="subtle" type="button" disabled>断开</button></form></section><p id="error" role="alert"></p>
<section id="chat-page" class="chat-page" aria-label="对话"><div id="conversation-scroll" class="conversation-scroll"><div class="conversation-width"><div id="chat-empty" class="empty-chat"><span class="welcome-mark" aria-hidden="true">◌</span><h2>今天，想聊点什么？</h2><p>输入一个问题，也可以开启语音，直接和我说。</p></div><div id="messages" role="log" aria-label="聊天记录"></div></div></div><div class="composer-wrap"><section id="music-panel" class="music-panel" aria-label="本地音乐" hidden><div><span id="music-state" class="speaker">准备播放</span><strong id="music-title"></strong></div><div class="music-controls"><label>音乐音量<input id="music-volume" type="range" min="0" max="100" value="50"></label><button id="music-pause" type="button" class="subtle">暂停</button><button id="music-next" type="button" class="subtle">下一首</button><button id="music-stop" type="button" class="subtle">停止</button></div></section><form id="text-form" class="composer"><label class="sr-only" for="text">发送消息</label><textarea id="text" rows="2" maxlength="4000" required placeholder="给声桥发消息…"></textarea><div class="composer-actions"><div><button type="button" id="mic" class="subtle" disabled>开启语音</button><button type="button" id="interrupt" class="subtle" disabled>停止播报</button></div><button id="send" disabled>发送 ↑</button></div></form><p class="composer-hint">语音打断只停止当前回复，已开始的任务会继续处理。</p></div></section>
<section id="recordings-page" class="recordings-page" aria-label="会议录音" hidden>
<div class="recordings-toolbar">
<div class="transport">
<button id="record-toggle" type="button" data-state="idle" aria-pressed="false" disabled>开始录音</button>
<button id="stop-recording" class="subtle" type="button" disabled hidden>停止</button>
</div>
<span id="recording-state" class="tag" role="status">未开始</span>
</div>
<div class="recordings-layout">
<section class="panel record-list">
<div class="section-heading"><div class="history-heading"><h2>录音历史</h2><span class="tag" id="recordings-count">0 个</span></div><button id="refresh-recordings" class="subtle" disabled>刷新列表</button></div>
<div id="recordings"><p class="hint">连接后查看你的录音。</p></div>
</section>
<section class="panel recording-detail" id="detail">
<div id="detail-empty" class="detail-empty"><div><h2>选择一条录音</h2><p class="hint">点击一条录音查看文字、播放和摘要；新的录音用上方按钮开始。</p></div></div>
<div id="detail-body" hidden>
<header class="recording-detail-head">
<div class="recording-detail-heading"><h2 id="detail-title">录音详情</h2><p class="hint" id="detail-meta">—</p></div>
<span class="tag" id="detail-state">已保存</span>
</header>
<p id="recording-notice" class="recording-notice" role="status" hidden></p>
<div class="detail-toolbar">
<audio id="player" controls></audio>
<div class="actions detail-actions"><button id="download-raw" class="subtle" type="button" disabled>下载原始录音</button><button id="download-ready" class="subtle" type="button" disabled>精简降噪</button><button id="export-transcript" class="subtle" type="button" disabled>导出文字</button></div>
</div>
<div class="recording-tabs" role="tablist" aria-label="录音内容"><button type="button" data-recording-tab="transcript" aria-selected="true">文字记录</button><button type="button" data-recording-tab="summary" aria-selected="false">摘要总结</button></div>
<section id="tab-transcript" class="recording-tab" role="tabpanel">
<p id="live-state" class="hint" hidden>正在录音，停顿后文字会实时出现在下面。</p>
<div id="transcript" class="transcript-lines" aria-live="polite"></div>
</section>
<section id="tab-summary" class="recording-tab" role="tabpanel" hidden>
<div class="actions summary-actions"><label>纪要模板<select id="templates"></select></label><button id="minutes-generate">生成摘要</button><button id="minutes-refresh" class="subtle">刷新</button></div>
<pre id="minutes"></pre>
</section>
</div>
</section>
</div>
</section>
</main></div></body></html>
